data:
  dataset: cifar10
  root: ./data
  num_classes: 10
  num_clients: 100
  partition: sparse_dirichlet
  labels_per_client: 4
  avg_samples_per_client: 100
  min_samples_per_client: 1
  dirichlet_alpha: 0.1
  sparse_classes_per_client: 4
  augment: false
  crop_padding: 4
  random_flip: true
  num_workers: 0
  pin_memory: false

model:
  name: resnet56_gn
  num_classes: 10

variational:
  prior_mu: 0.0
  prior_sigma: 1.0
  posterior_mu_init: 0.0
  posterior_rho_init: -3.0
  kl_weight: null
  kl_weight_schedule: false
  kl_warmup_rounds: 20
  lambda_scale_by_size: true
  mc_train: 2
  mc_eval: 5
  variance_floor_ratio: 0.5

training:
  optimizer: sgd
  learning_rate: 0.05
  momentum: 0.9
  weight_decay: 0.0
  batch_size: 128
  local_epochs: 10
  num_rounds: 300
  lr_scheduler: cosine
  min_learning_rate: 0.0001
  lr_decay_rounds: 400
  gradient_clip_norm: 10.0
  evaluate_every: 1

federation:
  client_fraction: 1.0

runtime:
  seed: 0
  replications: 1
  backend: ray
  client_num_cpus: 1.0
  client_num_gpus: 0.125
  ray_include_dashboard: false
  torch_num_threads: 1
  client_device: cuda
  server_device: cpu
  verbose_flower: false
  cleanup_cuda_after_fit: true
  fail_on_client_failure: true

output:
  directory: results/cifar10_baseline
  metrics_filename: metrics.csv
  clients_filename: client_metrics.csv
  reliability_filename: reliability.csv
  participation_filename: participation.csv
  save_checkpoints: true
  save_resolved_config: true
