[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bayesfl-base"
version = "0.1.0"
description = "Flower/Ray baseline for FedAvg, Bayes by Backprop, and Federated Online Laplace Approximation"
readme = "README.md"
requires-python = ">=3.10,<3.11"
authors = [{name = "Research baseline"}]
dependencies = [
  "flwr[simulation]==1.29.0",
  "bayesian-torch==0.5.0",
  "PyYAML>=6.0,<7",
  "numpy>=1.26,<3",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
bayesfl = "bayesfl.main:main"
bayesfl-plots = "bayesfl.utils:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
