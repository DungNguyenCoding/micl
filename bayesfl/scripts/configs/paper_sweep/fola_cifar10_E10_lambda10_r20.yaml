run_name: paper_sweep_fola_cifar10_E10_lambda10_r20
method: fola
data:
  dataset: cifar10
  root: ./data
  num_classes: 10
  augment: true
  crop_padding: 4
  crop_fill: 128
  random_flip: true
  autoaugment_policy: cifar10
  cutout_holes: 1
  cutout_length: 16
  normalize_mean:
  - 0.5
  - 0.5
  - 0.5
  normalize_std:
  - 0.5
  - 0.5
  - 0.5
  partition:
    type: paper_dirichlet
    dirichlet_alpha: 0.01
federation:
  num_clients: 20
  clients_per_round: 20
model:
  name: resnet56_gn8
  group_norm_groups: 8
training:
  optimizer: sgd
  lr: 0.05
  momentum: 0.9
  weight_decay: 0.0
  batch_size: 128
  local_epochs: 10
  rounds: 20
  lr_schedule: cosine
  lr_min: 0.0001
  lr_decay_rounds: 400
  grad_clip_norm: null
bbb:
  posterior_mu_init: 0.0
  posterior_rho_init: -3.0
  prior_type: standard_normal
  prior_mean: 0.0
  prior_sigma: 1.0
  prior_pi: 0.5
  prior_sigma1: 1.0
  prior_sigma2: 0.0024787521766663585
  kl_weight: null
  kl_scheme: equal_minibatch
  kl_weight_schedule: false
  kl_warmup_rounds: 20
  lambda_scale_by_size: true
  mc_train: 2
  mc_eval: 5
  variance_floor_ratio: 0.5
  rho_lr_multiplier: 0.1
  aggregation: gaussian_product
  match_deterministic_init: false
fola:
  prior_lambda: 10.0
  lambda_scale_by_size: false
  mc_eval: 5
  variance_floor_ratio: 0.5
  precision_min: 1.0e-12
  precision_max: 1000000000000.0
  initial_precision: 0.0
  mode: paper_reference
  aggregation_epsilon: 1.0e-05
  paper_mean_only_eval: true
runtime:
  client_num_cpus: 2.0
  client_num_gpus: 0.25
  central_eval_device: auto
  seed: 0
  torch_num_threads: 1
  verbose_flower: false
output:
  logs_dir: ./logs
  outputs_dir: ./outputs
  checkpoint_every: 10
  save_full_client_posteriors: false
