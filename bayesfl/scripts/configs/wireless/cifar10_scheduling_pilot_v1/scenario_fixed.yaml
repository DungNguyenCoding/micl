# CIFAR-10 engineering pilot. Paper-supported radio scales + explicitly assumed timing.
# Not a reproduced paper experiment or a measured device profile. Requires --allow-example.
# Preserve identical scenario for equal_bandwidth and joint; do not change only one policy.
status: EXAMPLE_NOT_LOCKED
scenario_id: cifar10_scheduling_pilot_v1
provenance:
  purpose: CIFAR-10 equal-bandwidth then joint-KL pilot; not final paper settings
  paper_00: 500 m disk; LTE path loss; 1 MHz; -174 dBm/Hz; nominal 24 dBm device and
    46 dBm BS powers
  adaptation: Fixed uplink PSD = 0.251188643150958 W / entire 1 MHz. Equal-share device
    power = 0.0125594321575479 W (10.9897 dBm), not 24 dBm.
  paper_07: Rayleigh block fading is reserved for a subsequent separately audited
    sensitivity, not enabled in this fixed-gain pilot.
  unsupported_by_papers:
  - 180 s target
  - 30 s control reservation
  - 1 Mbit/s control rate
  - 1 ms exchange latency
  - 1 ms/(sample epoch) compute
  - 0.1 s scoring
  - seed-0 topology
  topology_file: topology.json
