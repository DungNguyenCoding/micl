# Fig. 2 configuration: effect of BS coverage/active radius.
# This file is used only by main_fig2.py and does not affect main.py / Fig. 1.

num_rounds: 1000

# Fixed BS dataset size for ICC Fig. 2 / Table-I-like setting.
fig2_m0: 160

# Place all candidate devices inside coverage_m, then select only devices within
# each active radius below. This supports the user's interpretation:
# total placement coverage = 550m, active cases = 550m, 300m, 50m.
fig2_active_radii: [550, 300, 50]

# Reuse the same general parameters as Fig. 1.
data_dir: ./data
output_dir: outputs/fig2_cov550_active_radii
plot: true
num_devices: 300
num_flower_clients: 24
coverage_m: 550.0
num_subchannels: 1024
max_symbol_power_dbm: 20.0
noise_power_dbm: -50.0
power_scaling_db: -10.0
path_loss_exp: 4.0
mean_client_size: 160
min_client_size: 10
classes_per_client: 3
bs_stratified: true
local_epochs: 1
batch_size: 32
lr: 0.02
optimizer: sgd
momentum: 0.0
weight_decay: 0.0
num_workers: 0
device: auto
client_cpus: 1
client_gpus: 0
torch_threads: 1
cache_clients: true
eval_every: 1
track_distortion: true
split_seed: 42
runtime_seed: 42
seed: 42
