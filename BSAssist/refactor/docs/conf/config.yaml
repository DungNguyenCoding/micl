# Grouped Flower simulation for BS-assisted broadband OTA-FL on CIFAR-10.
# This keeps the physical target K=300 devices but groups them into fewer
# Flower virtual clients to reduce Ray overhead.

# Experiment length and output
num_rounds: 50
m0_values: [160]
data_dir: ./data
output_dir: ./outputs/cifar10_ota_flower_grouped
plot: true

# Physical OTA-FL setting
num_devices: 300
num_flower_clients: 48
coverage_m: 550.0
num_subchannels: 1024
max_symbol_power_dbm: 20.0
noise_power_dbm: -50.0
power_scaling_db: -10.0
path_loss_exp: 4.0

# CIFAR-10 non-IID/imbalanced client data
mean_client_size: 160
min_client_size: 10
classes_per_client: 3

# Local training
local_epochs: 3
batch_size: 10
lr: 0.05
optimizer: sgd
momentum: 0.0
weight_decay: 0.0
num_workers: 0

# Runtime / Flower resources
device: auto
client_cpus: 1.0
client_gpus: 0.0
torch_threads: 1
cache_clients: true

# Logging / metrics
eval_every: 5
track_distortion: true
seed: 42
