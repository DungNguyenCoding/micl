# Paper-like grouped Flower OTA-FL config for Fig. 1.
# main.py uses m0_values for Fig. 1.

num_rounds: 1000
m0_values: [1600, 160, 20]

data_dir: ./data
output_dir: outputs/fig1_cov550
plot: true

# Physical OTA-FL setting
num_devices: 300
num_flower_clients: 24
coverage_m: 550.0
num_subchannels: 1024
max_symbol_power_dbm: 20.0
noise_power_dbm: -50.0
power_scaling_db: -10.0
path_loss_exp: 4.0

# CIFAR-10 non-IID/imbalanced client data
mean_client_size: 160
min_client_size: 10
classes_per_client: 3
bs_stratified: true

# Local training
local_epochs: 1
batch_size: 32
lr: 0.02
optimizer: sgd
momentum: 0.0
weight_decay: 0.0
num_workers: 0

# Runtime / Flower resources
device: auto
client_cpus: 1.0
client_gpus: 0.0
torch_threads: 1
cache_clients: true

# Logging / metrics
eval_every: 1
track_distortion: true

# Reproducibility
split_seed: 42
runtime_seed: 42
seed: 42
