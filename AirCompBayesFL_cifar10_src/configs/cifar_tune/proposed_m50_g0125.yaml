data:
  root: data
  num_clients: 40
  labels_per_client: 1
  mean_samples_per_client: 50
  min_samples_per_client: 1
  bs_radius_m: 200
  num_workers: 0
  pin_memory: false
model:
  name: paper_cnn
  num_classes: 10
  initial_prior_std: 0.05
  min_posterior_std: 0.0001
  max_posterior_std: 10.0
  min_precision: 1.0e-06
  max_precision: 100000000.0
training:
  local_epochs: 3
  batch_size: 10
  learning_rate: 0.1
  kl_weight: 2.0e-05
  mc_train_samples: 5
  mc_eval_samples: 5
  bayesian_local_mode: paper_two_phase
  fedprox_mu: 0.01
  gradient_clip_norm: 10.0
  num_rounds: null
  max_channel_uses: 30000000
  evaluate_every: 1
wireless:
  enabled: true
  power_dbm: 23
  noise_dbm: -74
  num_subchannels: 1024
  path_loss_exponent: 4
  path_loss_reference_m: 1000.0
  gamma_db: 10
  min_channel_power: 1.0e-14
  power_control_mode: paper_reference_kkt
  deterministic_payload_mode: update
  deterministic_reference_power_mode: coordinated_aggregate
  bisection_steps: 60
runtime:
  backend: ray
  seed: 2025
  replications: 1
  client_num_cpus: 1
  client_num_gpus: 0.125
  ray_include_dashboard: false
  torch_num_threads: 1
  client_device: cuda
  server_device: cpu
  verbose_flower: false
  cleanup_cuda_after_fit: true
  cleanup_phase_state: true
  fail_on_client_failure: true
output:
  directory: results/proposed_priority
  metrics_filename: metrics.csv
  reliability_filename: reliability.csv
  clients_filename: client_metrics.csv
  save_checkpoints: true
